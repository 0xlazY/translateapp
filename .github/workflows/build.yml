# Builds an UNSIGNED IPA on every push. Needs no Apple account or secrets:
# SideStore signs the IPA with your Apple ID when you install it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Test core rules
        run: swift test --package-path Packages/PandouchkaCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Pandouchka.xcodeproj \
            -scheme Pandouchka \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pandouchka.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:" build.log | sort -u | head -100
              echo "::endgroup::"
              tail -40 build.log
              exit 1
            }

      - name: Package IPA
        run: |
          APP=build/Pandouchka.xcarchive/Products/Applications/Pandouchka.app
          test -x "$APP/Pandouchka"
          test -s "$APP/dictionary.sqlite"
          lipo -info "$APP/Pandouchka"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Pandouchka.ipa Payload)

      # archive: false uploads the IPA as-is (artifact named Pandouchka.ipa), no zip around it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/Pandouchka.ipa
          archive: false
          retention-days: 30
          if-no-files-found: error

  release:
    # Tagged builds get a stable download URL for sideloading.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Pandouchka.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" Pandouchka.ipa --generate-notes
